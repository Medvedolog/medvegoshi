name: Experimental AMOLED V1 MicroPython QSPI build

on:
  workflow_dispatch:
  push:
    branches: ["feature/russian-game-ui"]
    paths:
      - ".github/workflows/build-amoled-v1.yml"
      - "ports/build_amoled_v1.sh"
      - "ports/prepare_firmware.py"

permissions:
  contents: read

jobs:
  build-native-sh8601:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    # Fixed build environment: ESP-IDF v5.5.2, linux/amd64 digest.
    container:
      image: espressif/idf:v5.5.2@sha256:05cbfc42ed2e987b8026722c15bf1d8523d3e4fd1b4ac04d2e4056f5e0918b99
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned MicroPython 1.28.0 with native SH8601 QSPI module
        shell: bash
        run: |
          bash ports/build_amoled_v1.sh
      - name: Verify firmware artifact and provenance
        shell: bash
        run: |
          cd build/amoled-v1-native/output
          sha256sum --check SHA256SUMS
          test -s medvegoshi-amoled-v1-experimental.bin
          python3 -c 'import json; x=json.load(open("BUILD-METADATA.json")); assert x["installable"] is False and x["status"]=="BUILT_NOT_HARDWARE_TESTED"'
      - name: Upload EXPERIMENTAL untested QSPI firmware
        uses: actions/upload-artifact@v4
        with:
          name: medvegoshi-v1-native-UNTESTED
          path: build/amoled-v1-native/output/
          if-no-files-found: error
          retention-days: 14
