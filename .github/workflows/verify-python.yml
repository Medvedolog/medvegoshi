name: Python and Cyrillic checks

on:
  push:
    branches: ["feature/russian-game-ui"]
  pull_request:

jobs:
  firmware-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q main.py vida.py desenho.py font_ru.py portal.py companion
      - name: Check Cyrillic bitmap font
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run companion unit tests
        run: python -m unittest discover -s companion/testes -t .
